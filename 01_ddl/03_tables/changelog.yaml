databaseChangeLog:
  - changeSet:
      id: ddl-tables-001
      author: Pipecerquera
      labels: "HU-AUTH-001,ddl,tables"
      comment: "app_user: one role per user; the tenant only for ADMIN_BARBERSHOP and BARBER. No foreign keys here."
      changes:
        - sqlFile:
            path: 001_create_app_user.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/001_create_app_user.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-tables-002
      author: Pipecerquera
      labels: "HU-AUTH-001,ddl,tables"
      comment: "refresh_token: opaque, single use, 7 days, stored hashed."
      changes:
        - sqlFile:
            path: 002_create_refresh_token.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/002_create_refresh_token.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-tables-003
      author: Pipecerquera
      labels: "HU-AUTH-001,ddl,tables"
      comment: "password_reset_token: 6-digit code, stored hashed, 15 minutes, single use."
      changes:
        - sqlFile:
            path: 003_create_password_reset_token.sql
