  - changeSet:
      id: ddl-tables-004
      author: Pipecerquera
      labels: "HU-AUTH-001,ddl,tables"
      comment: "idempotency_key: makes every creation safe to retry (norm 5.3.8)."
      changes:
        - sqlFile:
            path: 004_create_idempotency_key.sql
