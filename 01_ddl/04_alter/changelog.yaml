databaseChangeLog:
  - changeSet:
      id: ddl-alter-001
      author: Pipecerquera
      labels: "HU-AUTH-001,ddl,alter"
      comment: "Foreign keys inside the domain, each declaring its delete behaviour."
      changes:
        - sqlFile:
            path: 001_add_foreign_keys.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/001_add_foreign_keys.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-alter-002
      author: Pipecerquera
      labels: "HU-AUTH-002,ddl,alter"
      comment: "outbox_event: failed_at and last_error, so the worker can set aside an event it cannot deliver (ADR-016)."
      changes:
        - sqlFile:
            path: 002_add_outbox_event_failure.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/002_add_outbox_event_failure.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
