databaseChangeLog:
  - changeSet:
      id: ddl-indexes-001
      author: Pipecerquera
      labels: "HU-AUTH-001,ddl,indexes"
      comment: "Unique e-mail (case-insensitive), foreign key columns and the tenant lookup."
      changes:
        - sqlFile:
            path: 001_create_indexes.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/10_indexes/001_create_indexes.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-indexes-002
      author: Pipecerquera
      labels: "HU-AUTH-002,ddl,indexes"
      comment: "The pending outbox index leaves failed events out; it replaces the one of ddl-indexes-001 instead of editing it."
      changes:
        - sqlFile:
            path: 002_replace_outbox_event_unpublished.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/10_indexes/002_replace_outbox_event_unpublished.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-indexes-003
      author: Pipecerquera
      labels: "HU-AUTH-004,ddl,indexes"
      comment: "The codes of a user by creation time (ADR-018)."
      changes:
        - sqlFile:
            path: 003_create_email_verification_code_index.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/10_indexes/003_create_email_verification_code_index.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
